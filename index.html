    <script>
      // Apply the stored theme before first paint so Dark/System users never
      // see a light flash. Mirrors src/lib/theme.ts — default is Light.
      (function () {
        try {
          var t = localStorage.getItem('stackduck-theme') || localStorage.getItem('proxibay-theme') || 'light'
          var dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
